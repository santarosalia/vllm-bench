[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-bench"
version = "0.1.0"
description = "vLLM serve 벤치를 실행하고 결과를 저장한다"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vllm @ https://github.com/vllm-project/vllm/releases/download/v0.30.0/vllm-0.30.0%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "vllm-metal @ https://github.com/vllm-project/vllm-metal/releases/download/v0.30.0.dev20260928205037/vllm_metal-0.30.0.dev20260928205037-cp312-cp312-macosx_15_0_arm64.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
bench = "bench:main"

[tool.setuptools]
py-modules = ["bench"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
